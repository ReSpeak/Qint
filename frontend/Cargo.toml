[package]
name = "qint-frontend"
version = "0.1.0"
authors = ["Flakebi <flakebi@t-online.de>"]
edition = "2018"
description = "The web frontend for the Qint TeamSpeak client"

[profile.dev]
opt-level = 3

[profile.release]
lto = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = "0.11"
chrono = "0.4"
console_error_panic_hook = "0.1"
console_log = "0.1"
failure = "0.1"
futures = "0.3"
qint-shared = { path = "../shared" }
serde = { version = "1", features = ["derive"] }
slog-stdlog = "4"
stdweb = "0.4"
tsproto-packets = { path = "../../tsclientlib/utils/tsproto-packets" }
ts-bookkeeping = { path = "../../tsclientlib/utils/ts-bookkeeping" }
uuid = { version = "0.8", features = ["wasm-bindgen", "v4"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
wee_alloc = "0.4"
yew = { version = "0.11", features = ["msgpack"] }

[dependencies.log]
version = "0.4"
features = ["max_level_info", "release_max_level_info"]

[dependencies.slog]
version = "2"
features = ["max_level_debug", "release_max_level_debug"]

[dependencies.web-sys]
version = "0.3"
features = [
	"Document",
	"Location",
	"NodeList",
	"Window",
]
