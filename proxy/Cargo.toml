[package]
name = "qint-proxy"
version = "0.1.0"
authors = ["Flakebi <flakebi@t-online.de>"]
edition = "2018"
build = "build.rs"
description = "Qint is a TeamSpeak client"

[dependencies]
actix = "0.9"
actix-files = "0.2"
actix-web = "2.0"
actix-web-actors = "2.0"
actix-rt = "1.0"
anyhow = "1"
audiopus = "0.2"
base64 = "0.12"
chrono = { version = "0.4", features = ["serde"] }
diesel = { version = "1.4", features = ["chrono", "sqlite"] }
diesel-derive-enum = { version = "0.4", features = ["sqlite"] }
diesel_migrations = "1.4"
directories = "2"
flakebi-ring = "0.16.9"
futures = "0.3"
libsqlite3-sys = { version = "0.9", features = ["bundled"] }
rmp-serde = "0.14"
rnnoise-c = "0.1"
sdl2 = "0.32"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slog-async = "2"
slog-scope = "4"
slog-stdlog = "3"
slog-term = "2"
structopt = { version = "0.3", default-features = false }
toml = "0.4"
tokio = "0.2"
tokio-util = { version = "0.3", features = ["codec"] }
tsclientlib = { path = "../../tsclientlib/tsclientlib", features = ["unstable"] }
tsproto = { path = "../../tsclientlib/tsproto" }
tsproto-packets = { path = "../../tsclientlib/utils/tsproto-packets" }
uuid = { version = "0.8", features = ["serde"] }

[dependencies.log]
version = "0.4"
features = ["max_level_info", "release_max_level_info"]

[dependencies.slog]
version = "2"
features = ["max_level_trace", "release_max_level_trace"]
