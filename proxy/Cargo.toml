[package]
name = "qint-proxy"
version = "0.1.0"
authors = [ "Flakebi <flakebi@t-online.de>" ]
edition = "2018"
description = "Qint is a TeamSpeak client"

[dependencies]
actix = "0.12"
actix-cors = "=0.6.0-beta.2"
actix-files = "=0.6.0-beta.6"
actix-web = "=4.0.0-beta.8"
actix-web-actors = "=4.0.0-beta.6"
actix-rt = "2"
actix-service = "2"
anyhow = "1"
audiopus = "0.2"
base64 = "0.13"
chacha20poly1305 = "0.8"
chrono = { version = "0.4", features = [ "serde" ] }
cookie = "0.15"
diesel = { version = "1.4", features = [ "chrono", "sqlite" ] }
diesel-derive-enum = { version = "1", features = [ "sqlite" ] }
diesel_migrations = "1.4"
directories-next = "2"
ebur128 = "0.1"
fancy-regex = "0.6"
futures = "0.3"
generic-array = "0.14"
git-testament = "0.2"
juniper = "0.15"
libsqlite3-sys = { version = "0.18", features = [ "bundled" ] }
livesplit-hotkey = { git = "https://github.com/LiveSplit/livesplit-core", rev = "624783aebf83fc23e040da174accffae44e5ed12", version = "0.5" }
meilisearch-core = { git = "https://github.com/meilisearch/MeiliSearch", rev = "ff38220b6821e7bf394f8e807f410a8a701414c9", version = "0.18" }
nnnoiseless = "0.3"
nom = "6"
open = "1"
percent-encoding = "2.1"
proxy-codegen = { path = "../proxy-codegen" }
pulldown-cmark = "0.8"
rand = "0.8"
regex = "1"
reqwest = "0.11"
rmp-serde = "0.15"
scraper = "0.12"
sdl2 = "0.34"
serde = { version = "1", features = [ "derive" ] }
serde_json = "1"
serde_ini = "0.2"
sled = "0.34"
slog-async = "2"
slog-envlogger = "2"
slog-scope = "4"
slog-stdlog = "4"
slog-term = "2"
structopt = { version = "0.3", default-features = false }
thiserror = "1"
time = "0.2"
toml = "0.5"
tokio = { version = "1", features = [ "fs" ] }
tokio-stream = "0.1"
tokio-util = { version = "0.6", features = [ "io" ] }
tsclientlib = { path = "../../tsclientlib/tsclientlib", features = [ "unstable" ] }
tsproto = { path = "../../tsclientlib/tsproto" }
tsproto-packets = { path = "../../tsclientlib/utils/tsproto-packets" }
tsproto-types = { path = "../../tsclientlib/utils/tsproto-types" }
url = "2"
uuid = { version = "0.8", features = [ "serde" ] }

[dependencies.log]
version = "0.4"
features = [ "max_level_info", "release_max_level_info" ]

[dependencies.slog]
version = "2"
features = [ "max_level_trace", "release_max_level_debug" ]

# Fix resolver=2 with diesel
[build-dependencies]
diesel = { version = "1.4", features = [ "chrono", "sqlite" ] }
libsqlite3-sys = { version = "0.18", features = [ "bundled" ] }

[dev-dependencies]
actix-codec = "0.4.0-beta.1"
awc = "3.0.0-beta.1"
rand = "0.8"
tempfile = "3"
uuid = { version = "0.8", features = [ "v4" ] }