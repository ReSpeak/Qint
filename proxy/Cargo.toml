[package]
name = "qint-proxy"
version = "0.1.0"
authors = [ "Flakebi <flakebi@t-online.de>" ]
edition = "2018"
description = "Qint is a TeamSpeak client"

[dependencies]
actix = "0.13"
actix-rt = "2"
anyhow = "1"
audiopus = "0.3.0-rc.0"
base64 = "0.22"
bytes = "1"
chacha20poly1305 = "0.10.0-pre"
chrono = { version = "0.4", features = [ "serde" ] }
diesel = { version = "2", features = [ "chrono", "sqlite" ] }
diesel_migrations = "2"
diesel-derive-enum = { version = "2", features = [ "sqlite" ] }
directories-next = "2"
ebur128 = "0.1"
fancy-regex = "0.10"
futures = "0.3"
generic-array = "0.14"
git-testament = "0.2"
juniper = "0.15"
libsqlite3-sys = { version = "0.33", features = [ "bundled" ] }
livesplit-hotkey = { version = "0.7" }
nnnoiseless = { version = "0.5", default-features = false }
num-derive = "0.4"
num-traits = "0.2"
oboe = { version = "0.6", optional = true, features = [ "shared-stdcxx" ] }
percent-encoding = "2.1"
proxy-codegen = { path = "../proxy-codegen" }
pulldown-cmark = "0.9"
rand = "0.8"
regex = "1"
reqwest = { version = "0.12", default-features = false }
rmp-serde = "1"
scraper = "0.13"
sdl2 = { version = "0.37", optional = true }
serde = { version = "1", features = [ "derive" ] }
serde_ini = "0.2"
serde_json = "1"
sled = "0.34"
tantivy = "0.18"
thiserror = "1"
time = "0.3"
tokio = { version = "1", features = [ "fs" ] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = [ "io" ] }
toml = "0.5"
tracing = "0.1"
tsclientlib = { git = "https://github.com/ReSpeak/tsclientlib", default-features = false, features = [ "unstable" ] }
tsproto = { git = "https://github.com/ReSpeak/tsclientlib" }
tsproto-packets = { git = "https://github.com/ReSpeak/tsclientlib" }
tsproto-types = { git = "https://github.com/ReSpeak/tsclientlib" }
url = "2"
uuid = { version = "1", features = [ "serde" ] }

# Fix resolver=2 with diesel
[build-dependencies]
diesel = { version = "2", features = [ "chrono", "sqlite" ] }
libsqlite3-sys = { version = "0.33", features = [ "bundled" ] }

[dev-dependencies]
rand = "0.8"
uuid = { version = "1", features = [ "v4" ] }
