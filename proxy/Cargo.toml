[package]
name = "qint-proxy"
version = "0.1.0"
authors = ["Flakebi <flakebi@t-online.de>"]
edition = "2018"
build = "build.rs"

[dependencies]
actix = "0.9"
actix-files = "0.2"
actix-rt = "1.0"
actix-web = "2.0"
actix-web-actors = "2.0"
async-timer = "0.2"
audiopus = "0.1"
base64 = "0.10"
bytes = "0.5"
chrono = "0.4"
diesel = { version = "1.4", features = ["chrono", "sqlite"] }
diesel-derive-enum = { version = "0.4", features = ["sqlite"] }
diesel_migrations = "1.4"
directories = "2"
failure = "0.1"
flakebi-ring = "0.16.9"
futures01 = { package = "futures", version = "0.1" }
futures = { version = "0.3", features = ["compat"] }
futures-spawn = "0.1"
futures-threadpool = "0.1"
hex = "0.4"
lazy_static = "1"
libsqlite3-sys = { version = "0.9", features = ["bundled"] }
parking_lot = "0.8"
qint-shared = { path = "../shared", features = ["db"] }
rmp-serde = "0.14"
sdl2 = "0.32"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slog-async = "2"
slog-scope = "4"
slog-stdlog = "3"
slog-term = "2"
structopt = "0.2"
toml = "0.4"
tokio = "0.2"
tokio01 = { package = "tokio", version = "0.1" }
tokio-compat = "0.1"
tokio-util = "0.2"
tsclientlib = { path = "../../tsclientlib/tsclientlib" }
tsproto = { path = "../../tsclientlib/tsproto" }
tsproto-packets = { path = "../../tsclientlib/utils/tsproto-packets" }
uuid = { version = "0.8", features = ["serde"] }

[dependencies.log]
version = "0.4"
features = ["max_level_info", "release_max_level_info"]

[dependencies.slog]
version = "2"
features = ["max_level_debug", "release_max_level_debug"]
