[package]
name = "qint"
version = "0.1.1"
authors = [ "Flakebi <flakebi@t-online.de>" ]
description = ""
edition = "2018"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "qint_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
actix = "0.13"
actix-rt = "2"
anyhow = "1"
base64 = "0.22"
bytes = "1"
futures = "0.3"
juniper = "0.15"
proxy-codegen = { path = "../proxy-codegen" }
serde = { version = "1.0", features = [ "derive" ] }
serde_json = "1.0"
sha2 = "0.10"
structopt = { version = "0.3", default-features = false }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-http = "2"
tauri-plugin-notification = "2"
tauri-plugin-shell = "2"
thiserror = "1"
tokio = "1"
tokio-util = { version = "0.7", features = [ "io" ] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [ "env-filter" ] }
tsproto-types = { git = "https://github.com/ReSpeak/tsclientlib" }

[target."cfg(not(target_os = \"android\"))".dependencies]
qint-proxy = { path = "../proxy", features = ["sdl2"] }
tsclientlib = { git = "https://github.com/ReSpeak/tsclientlib", features = [ "unstable" ] }

[target."cfg(target_os = \"android\")".dependencies]
qint-proxy = { path = "../proxy", features = ["oboe"] }
tsclientlib = { git = "https://github.com/ReSpeak/tsclientlib", default-features = false, features = [ "audio", "unstable" ] }
# Use rustls for easier cross-compiling
reqwest = { version = "0.12", default-features = false, features = ["charset", "http2", "rustls-tls"] }

[features]
# this feature is used for production builds or when `devPath` points to the filesystem and the built-in dev server is disabled.
# If you use cargo directly instead of tauri's cli you can use this feature flag to switch between tauri's `dev` and `build` modes.
# DO NOT REMOVE!!
custom-protocol = [ "tauri/custom-protocol" ]
