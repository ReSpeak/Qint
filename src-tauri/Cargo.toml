[package]
name = "qint"
version = "0.1.0"
authors = [ "Flakebi <flakebi@t-online.de>" ]
description = ""
edition = "2018"
build = "src/build.rs"

[build-dependencies]
tauri-build = { version = "1.0.0-rc.12" }

[features]
custom-protocol = [ "tauri/custom-protocol" ]
default = [ "custom-protocol" ]

[dependencies]
actix = "0.13"
actix-rt = "2"
anyhow = "1"
base64 = "0.13"
bytes = "1"
futures = "0.3"
juniper = "0.15"
proxy-codegen = { path = "../proxy-codegen" }
qint-proxy = { path = "../proxy", features = ["sdl2"] }
serde = { version = "1.0", features = [ "derive" ] }
serde_json = "1.0"
sha2 = "0.10"
structopt = { version = "0.3", default-features = false }
tauri = { version = "1.0.0-rc.14", features = ["ayatana-tray", "window-all", "dialog-all", "http-all", "notification-all", "system-tray", "shell-open"] }
thiserror = "1"
tokio = "1"
tokio-util = { version = "0.7", features = [ "io" ] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [ "env-filter" ] }
tsclientlib = { git = "https://github.com/ReSpeak/tsclientlib", features = [ "unstable" ] }
tsproto-types = { git = "https://github.com/ReSpeak/tsclientlib" }

[target."cfg(windows)".build-dependencies]
winres = "0.1"
