[package]
name = "qint-shared"
version = "0.1.0"
authors = ["Flakebi <flakebi@t-online.de>"]
edition = "2018"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
diesel = { version = "1.4", features = ["chrono", "sqlite"], optional = true }
diesel-derive-enum = { version = "0.4", features = ["sqlite"], optional = true }
serde = { version = "1", features = ["derive"] }
tsproto-packets = { path = "../../tsclientlib/utils/tsproto-packets" }
tsproto-types = { path = "../../tsclientlib/utils/tsproto-types" }

[features]
db = ["diesel", "diesel-derive-enum"]
