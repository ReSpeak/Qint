[package]
name = "webapp"
version = "0.1.0"
edition = "2018"

[dependencies]
actix = "0.12"
actix-cors = "0.6"
actix-files = "0.6"
actix-http = "3"
# Exclude zstd from dependencies because a newer version is pulled in by tauri and milli
actix-web = { version = "4", default-features = false, features = ["compress-brotli", "cookies", "macros"] }
actix-web-actors = "4"
actix-router = "0.5"
actix-rt = "2"
anyhow = "1"
base64 = "0.13"
futures = "0.3"
juniper = "0.15"
open = "2"
proxy-codegen = { path = "../proxy-codegen" }
qint-proxy = { path = "../proxy", features = ["sdl2"] }
rand = "0.8"
serde = { version = "1", features = [ "derive" ] }
serde_json = "1"
serde_ini = "0.2"
structopt = { version = "0.3", default-features = false }
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [ "env-filter" ] }
tsclientlib = { git = "https://github.com/ReSpeak/tsclientlib", features = [ "unstable" ] }
tsproto = { git = "https://github.com/ReSpeak/tsclientlib" }
tsproto-packets = { git = "https://github.com/ReSpeak/tsclientlib" }
tsproto-types = { git = "https://github.com/ReSpeak/tsclientlib" }
tokio = { version = "1", features = [ "fs" ] }
tokio-util = { version = "0.6", features = [ "io" ] }
uuid = { version = "0.8", features = [ "serde" ] }

[dev-dependencies]
actix-codec = "0.4.2"
# Exclude zstd from dependencies because a newer version is pulled in by tauri and milli
awc = { version = "3", default-features = false, features = ["compress-brotli", "cookies"] }
once_cell = "1"
tempfile = "3"
