[workspace]
members = ["proxy-codegen", "proxy", "src-tauri"]

[patch.crates-io]
# Use master branch to fix reserving 200 G disk space on windows
lmdb-rkv-sys = { git = "https://github.com/Flakebi/lmdb-rs" }

# Compile in release mode to speed up
[profile.dev.package.audiopus]
opt-level = 3
[profile.dev.package.ebur128]
opt-level = 3
[profile.dev.package.nnnoiseless]
opt-level = 3

[profile.release]
debug = true
